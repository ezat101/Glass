<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ElTabakha Glass</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الطباخه">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#fff;--card:#fff;--ink:#111827;--mute:#4b5563;--line:#b8c0cc;--acc:#0f766e;--accInk:#fff;--accB:#0f766e;--tot:#eef3f2;--danger:#b91c1c;--drB:#fee2e2;--drI:#991b1b;--crB:#dcfce7;--crI:#166534;color-scheme:light}
*{box-sizing:border-box}
html,body{background:#fff}
body{margin:0;color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin-inline:auto;font-size:16px}
.card,.rec,.row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:2px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:9px 8px;border:1px solid #98a2b3;border-radius:8px;background:#fff;color:var(--ink);min-width:0}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=checkbox]{width:auto}
textarea{font-size:12px;direction:ltr;text-align:left}
.tabs,.seg{display:flex;gap:4px;margin-bottom:8px}
.tabs button,.seg button{flex:1;padding:9px 4px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.tabs button.on,.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.seg.s button{padding:6px 4px;font-size:14px}
button.main,a.main{background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:8px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;display:inline-block}
button.alt{background:#fff;color:var(--ink);border:1px solid #98a2b3;border-radius:8px;padding:11px 14px;font:inherit;cursor:pointer}
.ab{display:inline-block;text-decoration:none;color:var(--ink);border:1px solid #98a2b3;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;font-family:inherit;background:#fff}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px 2px}
.del{background:none;border:0;color:var(--danger);font-size:22px;cursor:pointer;padding:0 6px;line-height:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.rg{display:grid;gap:6px;margin:6px 0 4px}.rg.a{grid-template-columns:repeat(4,1fr)}.rg.r{grid-template-columns:1fr 1fr}.rg input{text-align:center;padding:8px 2px}
.r1{display:flex;gap:4px;align-items:center}
.ro,.sum div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ro{font-size:13px;color:var(--mute)}.ro b{color:var(--ink)}
.rowc{display:flex;gap:6px;margin-bottom:8px}
.sum div{padding:6px 0;border-bottom:1px solid #e5e7eb;font-size:15px}.sum div:last-child{border:0}
.sum div.big{background:var(--tot);padding:8px 10px;border-radius:8px;font-weight:700;font-size:17px;margin:4px 0;border:0}
.sum input{width:120px;text-align:center;padding:6px}
.num{font-variant-numeric:tabular-nums}.mute{color:var(--mute);font-size:13px}
.info{font-size:13px;margin-top:6px;color:var(--mute)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btns .main,.btns .alt{flex:1}
.cn{font-weight:600}.cb{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--tot);white-space:nowrap;color:var(--ink)}.cb.dr{background:var(--drB);color:var(--drI)}.cb.cr{background:var(--crB);color:var(--crI)}
.cr2{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.it{display:grid;gap:4px;margin-bottom:4px;align-items:center}.it input{padding:6px 4px;font-size:15px;text-align:center}.it input:first-child{text-align:right}
.it button{padding:0;width:34px;height:34px;font-size:18px}
table.st{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.st th{color:var(--mute);font-weight:500;padding:4px 2px;border-bottom:1px solid var(--line)}.st td{padding:7px 2px;text-align:center;border-bottom:1px solid #e5e7eb}.st tr[data-rec]{cursor:pointer}
#dd{position:fixed;z-index:50;background:#fff;border:1px solid #98a2b3;border-radius:8px;max-height:220px;overflow:auto;display:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#dd div{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #eee}#dd small{color:var(--mute)}
#resimg{width:100%;border-radius:6px;border:1px solid var(--line);background:#fff;margin-top:6px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="tabs" id="tabs"><button data-t="new" class="on">فاتورة</button><button data-t="cu">العملاء</button><button data-t="it">الأصناف</button><button data-t="st">الإعدادات</button></div>

<div id="res" class="card hide">
  <div class="ro" style="color:var(--ink)"><b id="resm"></b><button class="del" id="resx" aria-label="إغلاق">×</button></div>
  <img id="resimg" alt="الصورة">
  <div class="btns"><button class="main" id="ressh">إرسال للعميل</button><a class="main" id="reswa" target="_blank" rel="noopener" href="#">إرسال للعميل</a><button class="alt" id="resdl">حفظ الصورة</button></div>
  <div class="btns" style="margin-top:2px"><a class="lnk hide" id="restx" target="_blank" rel="noopener" href="#">نص فقط</a><button class="lnk hide" id="resedit">تعديل</button><button class="lnk hide" id="resdel" style="color:var(--danger)">حذف</button></div>
  <div class="mute" id="reshint"></div>
</div>

<section id="t-new">
  <div class="card">
    <label>العميل</label>
    <input id="cust" list="cl" autocomplete="off" placeholder="اكتب اسم العميل"><datalist id="cl"></datalist>
    <div id="phoneBox" class="hide" style="margin-top:6px"><label>واتساب (اختياري)</label><input id="phone" type="tel" inputmode="tel"></div>
    <div class="info" id="cinfo"></div>
  </div>
  <div id="rows"></div>
  <div class="mute" id="rhint" style="margin-bottom:6px">اضغط لإضافة بند:</div>
  <div class="btns" style="margin:0 0 8px"><button class="alt" data-add="rd">+ جاهز</button><button class="alt" data-add="mq">+ مقطع</button></div>
  <div class="card sum">
    <div id="r_sub" class="hide"><span>إجمالي الإذن<span class="num" id="tqw"></span></span><b class="num" id="sub">0.00</b></div>
    <div id="r_nylon" class="hide"><span>نولون</span><input id="nylon" type="number" inputmode="decimal" placeholder="0"></div>
    <div id="r_disc" class="hide"><span>خصم</span><input id="disc" type="number" inputmode="decimal" placeholder="0"></div>
    <div id="r_prev" class="hide"><span>رصيد سابق</span><input id="prev" type="number" inputmode="decimal" placeholder="0"></div>
    <div class="big"><span>الإجمالي</span><span class="num" id="grand">0.00</span></div>
    <div><span>المدفوع الآن</span><input id="paid" type="number" inputmode="decimal" placeholder="0"></div>
    <div class="big"><span>المتبقي</span><span class="num" id="rest">0.00</span></div>
  </div>
  <button class="lnk" id="moreBtn">+ إضافات (نولون، خصم، ملاحظة)</button>
  <input id="note" class="hide" placeholder="ملاحظة تظهر في الفاتورة">
  <div class="btns"><button class="main" id="save">حفظ الفاتورة</button><button class="alt" id="saveImg">حفظ كصورة</button></div>
  <div class="info" id="msg" style="color:var(--danger)"></div>
  <button class="lnk" id="clear" style="color:var(--mute)">مسح الفاتورة</button>
</section>

<section id="t-cu" class="hide">
  <div id="cuMain">
    <div class="rowc"><input id="cq" placeholder="ابحث باسم العميل"><button class="main" data-m="add">+ عميل</button></div>
    <div id="cuAdd" class="card hide">
      <input id="nc_name" placeholder="اسم العميل (مطلوب)">
      <div class="g2" style="margin-top:6px"><input id="nc_phone" type="tel" inputmode="tel" placeholder="واتساب (اختياري)"><input id="nc_bal" type="number" inputmode="decimal" placeholder="حساب قديم عليه"></div>
      <div class="g2"><input id="nc_addr" placeholder="العنوان (اختياري)"><input id="nc_note" placeholder="ملاحظات (اختياري)"></div>
      <div class="btns" style="margin:0"><button class="main" id="addCu">حفظ العميل</button></div><div class="info" id="cuMsg" style="color:var(--danger)"></div>
    </div>
    <div class="seg" id="cuMode"><button data-m="all" class="on">العملاء</button><button data-m="debt">المديونين</button><button data-m="hist">الفواتير</button></div>
    <div id="cuTot" style="margin-bottom:6px;font-size:14px;font-weight:600"></div>
    <div id="cuList"></div>
  </div>
  <div id="cuDet" class="hide"></div>
</section>

<section id="t-it" class="hide">
  <div class="seg s" style="max-width:220px" id="seg"><button data-it="rd">جاهز</button><button data-it="mq" class="on">مقطع</button></div>
  <div id="nform" class="it"></div>
  <div id="ihead" class="mute"></div><div id="items" style="margin-top:4px"></div>
</section>

<section id="t-st" class="hide">
  <div class="card"><b>حالة الحفظ</b><div id="stor" style="margin-top:4px;font-size:14px"></div><div class="mute" style="margin-top:4px">نسخة التطبيق: 5</div></div>
  <div class="card"><b>الإرسال</b>
    <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin-top:6px"><input type="checkbox" id="autoWa"> بعد حفظ الفاتورة افتح الإرسال للعميل تلقائياً</label></div>
  <div class="card"><b>النسخة الاحتياطية</b><div class="mute" id="bkInfo" style="margin-top:4px"></div>
    <div class="btns"><button class="main" id="bkSave">حفظ نسخة</button><button class="alt" id="bkLoad">استرجاع نسخة</button><input type="file" id="bkFile" accept=".json,application/json" class="hide"></div><div class="info" id="bkMsg"></div></div>
  <div class="card"><b>المزامنة السحابية</b><div id="fbStat" style="margin:4px 0 8px;font-size:14px">غير مربوطة.</div>
    <div class="btns" style="margin:0"><button class="main" id="fbGoogle">دخول بحساب Google</button><button class="alt" id="fbOff">فصل</button></div>
    <a href="#" id="fbMore" style="display:inline-block;margin-top:10px;font-size:14px">دخول بالإيميل بدلاً من Google</a>
    <div id="fbMail" class="hide"><div class="g2" style="margin-top:6px"><input id="fbEmail" type="email" placeholder="الإيميل" style="direction:ltr"><input id="fbPass" type="password" placeholder="كلمة السر" style="direction:ltr"></div>
    <div class="btns" style="margin-top:6px"><button class="alt" id="fbConnect">دخول بالإيميل</button></div></div></div>
</section>

<div id="dd"></div>

<script>
const $=id=>document.getElementById(id);
const f=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:false});
const nv=x=>parseFloat(x)||0;
const rd2=x=>Math.round(x*100)/100;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const two=n=>String(n).padStart(2,'0');
function stamp(t){const d=new Date(t);let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return `${d.getFullYear()}/${two(d.getMonth()+1)}/${two(d.getDate())}  ${two(h)}:${two(d.getMinutes())} ${ap}`}
const dshort=t=>{const d=new Date(t);return `${d.getFullYear()}/${two(d.getMonth()+1)}/${two(d.getDate())}`};
function lget(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function lset(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}}
const sfail=()=>{$('stor').textContent='تنبيه: تعذر الحفظ السحابي، البيانات محفوظة على هذا الجهاز.'};
const sf=fn=>{try{const p=fn();if(p&&p.catch)p.catch(sfail)}catch(e){sfail()}};
const S={items:[],customers:[],invoices:[]};let db=null;

/* ---------- حساب العميل (يُحسب دائماً من السجل) ---------- */
const val=r=>r.type==='pay'?0:rd2(r.total-r.prev),pd=r=>r.type==='pay'?r.amount:r.paid;
const ledger=c=>S.invoices.filter(r=>r.cid===c.id);
const balOf=c=>rd2((c.open||0)+ledger(c).reduce((a,r)=>a+(r.type==='pay'?-r.amount:val(r)-r.paid),0));
const nextNo=c=>Math.max(c.nn||0,0,...ledger(c).filter(r=>r.type==='inv').map(r=>r.no||0))+1;
const bal=c=>{const b=balOf(c);return b>0?'عليه '+f(b):b<0?'له '+f(-b):'0.00'};
const bcls=c=>{const b=balOf(c);return b>0?'dr':b<0?'cr':''};
const getC=id=>S.customers.find(c=>c.id===id);const cn=r=>{const c=getC(r.cid);return c?c.name:r.cname};

/* ---------- التخزين ---------- */
const hs=t=>{let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h).toString(36)};
function migrate(){
  S.items=S.items.map(i=>{const v=i.v||{};return{id:i.id||'i'+hs((i.type||'')+i.name),u:i.u||0,type:i.type==='rd'?'rd':'mq',name:i.name,p:v.p!==undefined?v.p:(i.price||i.p||0),w:v.w!==undefined?v.w:(i.w||0),h:v.h!==undefined?v.h:(i.h||0)}});
  let ch=false;S.customers.forEach(c=>{if(c.open===undefined){const rs=ledger(c).sort((a,b)=>a.ts-b.ts);c.open=rs.length?(rs[0].prev||0):(c.balance||0);ch=true}});
  if(ch)lset('customers',S.customers)}
function loadLocal(){S.items=lget('items');S.customers=lget('customers');S.invoices=lget('invoices');migrate()}
const tmo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
function mergeK(k,remote){const m=new Map(S[k].map(x=>[x.id,x])),up=[],rid=new Set(remote.map(r=>r.id));
  remote.forEach(r=>{const l=m.get(r.id);if(!l)m.set(r.id,r);else if((r.u||0)>(l.u||0))m.set(r.id,r);else if((l.u||0)>(r.u||0))up.push(l)});
  S[k].forEach(l=>{if(!rid.has(l.id))up.push(l)});S[k]=[...m.values()];lset(k,S[k]);return up}
function dedupe(){const by=new Map();let ch=false;
  S.customers.slice().sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0).forEach(c=>{if(!c.name)return;const m=by.get(c.name);if(!m){by.set(c.name,c);return}
    ch=true;m.open=rd2((m.open||0)+(c.open||0));m.nn=Math.max(m.nn||0,c.nn||0);m.phone=m.phone||c.phone||'';m.addr=m.addr||c.addr||'';m.note=m.note||c.note||'';
    S.invoices.forEach(r=>{if(r.cid===c.id){r.cid=m.id;put('invoices',r)}});put('customers',m);del('customers',c.id)});
  return ch}
async function loadCloud(){let d=null;
  d=await getDb();
  if(d){try{
    const rdc=async c=>((await tmo(d.collection(c).get(),12000)).docs||[]).map(x=>x.data());
    await flushDel(d);const [ri0,rc0,rv0,rdl]=await Promise.all([rdc('items'),rdc('customers'),rdc('invoices'),rdc('dels').catch(()=>[])]);
    rdl.forEach(x=>TOMB.add(x.k+':'+x.id));const pdl=new Set(lget('pdel').map(x=>x.k+':'+x.id));
    const fl=(k,a)=>a.filter(x=>!pdl.has(k+':'+x.id)&&!TOMB.has(k+':'+x.id));const ri=fl('items',ri0),rc=fl('customers',rc0),rv=fl('invoices',rv0);
    ['items','customers','invoices'].forEach(k=>{const n=S[k].length;S[k]=S[k].filter(x=>!TOMB.has(k+':'+x.id));if(S[k].length!==n)lset(k,S[k])});
    [['items',ri0],['customers',rc0],['invoices',rv0]].forEach(([k,a])=>a.forEach(x=>{if(TOMB.has(k+':'+x.id))sf(()=>d.collection(k).doc(x.id).delete())}));
    const la=await tmo(d.doc('app/items').get(),12000),lb=await tmo(d.doc('app/customers').get(),12000);
    const li=la.exists?(la.data().list||[]).map(i=>({...i,id:i.id||'i'+hs((i.type||'')+i.name),u:i.u||0})):[],lc=lb.exists?(lb.data().list||[]).map(c=>({...c,u:c.u||0})):[];
    const up=[];
    [['items',fl('items',[...ri,...li])],['customers',fl('customers',[...rc,...lc])],['invoices',rv]].forEach(([k,r])=>mergeK(k,r).forEach(o=>up.push([k,o])));
    migrate();db=d;
    try{await tmo(Promise.all(up.map(([k,o])=>d.collection(k).doc(o.id).set(o))),20000)}catch(e){sfail()}
    if(la.exists)sf(()=>d.doc('app/items').delete());if(lb.exists)sf(()=>d.doc('app/customers').delete());
    dedupe();
    $('stor').textContent='الحفظ: تخزين سحابي.';return true}catch(e){}}
  db=null;$('stor').textContent='الحفظ: على هذا الجهاز فقط.';return false}
function put(k,o){o.u=Date.now();lset(k,S[k]);if(db)sf(()=>db.collection(k).doc(o.id).set(o))}
const TOMB=new Set();
async function flushDel(d){const l=lget('pdel');if(!l.length||!d)return;const done=new Set();
  for(const x of l){const key=x.k+':'+x.id;try{await d.collection(x.k).doc(x.id).delete();await d.collection('dels').doc(x.k+'_'+x.id).set({k:x.k,id:x.id,u:Date.now()});TOMB.add(key);done.add(key)}catch(e){}}
  lset('pdel',lget('pdel').filter(x=>!done.has(x.k+':'+x.id)))}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);lset(k,S[k]);const l=lget('pdel');l.push({k,id});lset('pdel',l);if(db)sf(()=>flushDel(db))}
let tm;const dirty=new Map();
function touch(k,o){dirty.set(k+o.id,[k,o]);clearTimeout(tm);tm=setTimeout(()=>{dirty.forEach(([k,o])=>put(k,o));dirty.clear()},500)}

/* ---------- التبويبات ---------- */
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));
  ['new','cu','it','st'].forEach(k=>$('t-'+k).classList.toggle('hide',k!==t));
  if(t==='cu')drawCusts();if(t==='new'&&lastC&&!EDIT){$('prev').value=balOf(lastC)||'';calc()}};

/* ---------- رسم الصورة (بدون مكتبات) ---------- */
function sheet(o){
  const W=700,P=20,IW=W-2*P,LH=22,F='Tahoma, Arial, "Noto Naskh Arabic", sans-serif',mc=document.createElement('canvas').getContext('2d');
  const wrap=(t,w,font)=>{mc.font=font;mc.direction='rtl';const out=[];let cur='';for(const wd of String(t==null?'':t).split(/\s+/)){const tr=cur?cur+' '+wd:wd;if(!cur||mc.measureText(tr).width<=w)cur=tr;else{out.push(cur);cur=wd}}out.push(cur);return out};
  const paint=x=>{let y=10;x.direction='rtl';x.textBaseline='middle';
    const T=(s,px,py,al,font,col)=>{x.font=font;x.textAlign=al;x.fillStyle=col||'#000';x.fillText(String(s),px,py)};
    x.direction='ltr';T('ElTabakha Glass',W-P,y+10,'right','bold 17px '+F,'#0f766e');x.direction='rtl';
    T(o.date,P,y+10,'left','13px '+F,'#555');y+=24;
    T('العميل / '+o.name,W/2,y+13,'center','bold 24px '+F);y+=30;
    T(o.sub,W/2,y+7,'center','14px '+F,'#555');y+=22;
    (o.meta||[]).forEach(s=>{T(s,W-P,y+10,'right','15px '+F);y+=24});y+=4;
    (o.tables||[]).forEach(tb=>{
      if(tb.title){T(tb.title,W-P,y+10,'right','bold 15px '+F);y+=24}
      const ws=tb.w.map(v=>v*IW),hh=30;let xr=W-P;x.fillStyle='#eee';x.fillRect(P,y,IW,hh);x.strokeStyle='#444';
      tb.th.forEach((h,i)=>{T(h,xr-ws[i]/2,y+hh/2,'center','bold 14px '+F);x.strokeRect(xr-ws[i],y,ws[i],hh);xr-=ws[i]});y+=hh;

  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return'anchor'}catch(e){return'fail'}}
